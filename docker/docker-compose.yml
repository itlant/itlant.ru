services:
  nginx:
    image: nginx:alpine
    container_name: itlant-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../wp:/var/www/html
      - ../theme:/var/www/html/wp-content/themes/itlant
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - itlant

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: itlant-php
    restart: unless-stopped
    volumes:
      - ../wp:/var/www/html
      - ../theme:/var/www/html/wp-content/themes/itlant
      - ../root/dist/assets:/var/www/html/wp-content/themes/itlant/assets
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: itlant
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - itlant

  mysql:
    image: mysql:8.0
    container_name: itlant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: itlant
      MYSQL_USER: wp
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "33061:3306"
    networks:
      - itlant

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: itlant-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: wp
      PMA_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - itlant

networks:
  itlant:
    driver: bridge

volumes:
  mysql_data: