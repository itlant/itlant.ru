<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>@@title</title>
  <meta name="description" content="@@description" />
  <link rel="canonical" href="@@canonical" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ITLANT" />
  <meta property="og:title" content="@@title" />
  <meta property="og:description" content="@@description" />
  <meta property="og:url" content="@@canonical" />
  <meta
    property="og:image"
    content="https://itlant.ru/assets/img/og/default.jpg"
  />
  <meta property="og:locale" content="ru_RU" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="@@title" />
  <meta name="twitter:description" content="@@description" />
  <meta
    name="twitter:image"
    content="https://itlant.ru/assets/img/og/default.jpg"
  />

  <!-- Favicon -->

  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="/assets/favicon/favicon-96x96.png"
  />
  <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/assets/favicon/apple-touch-icon.png"
  />
  <link rel="manifest" href="/assets/favicon/site.webmanifest" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Schema.org -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ITLANT",
      "url": "https://itlant.ru",
      "logo": "https://itlant.ru/assets/img/logo.svg",
      "description": "Веб-студия: разработка сайтов, SEO-продвижение, реклама",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@itlant.ru",
        "contactType": "customer service",
        "availableLanguage": "Russian"
      }
    }
  </script>
</head>
