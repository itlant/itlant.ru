<div
  class="modal"
  id="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
  hidden
>
  <div class="modal__overlay" data-modal-close></div>

  <div class="modal__window win-window">
    <div class="win-window__titlebar">
      <span class="win-window__title" id="modal-title">NEW_REQUEST.EXE</span>
      <div class="win-window__controls">
        <button class="win-window__close" data-modal-close aria-label="Закрыть">
          ×
        </button>
      </div>
    </div>

    <div class="win-window__body">
      <form class="form" action="/send.php" method="post" novalidate>
        <label class="form__field">
          <span>Ваше имя</span>
          <input type="text" name="name" required autocomplete="name" />
        </label>

        <label class="form__field">
          <span>Email или телефон</span>
          <input type="text" name="contact" required autocomplete="email" />
        </label>

        <label class="form__field">
          <span>Услуга</span>
          <select name="service">
            <option value="">— Выберите услугу —</option>
            <option value="wordpress">Разработка на WordPress</option>
            <option value="tilda">Разработка на Tilda</option>
            <option value="seo-opt">SEO-оптимизация</option>
            <option value="seo-promo">SEO-продвижение</option>
            <option value="1c">Интеграция 1С</option>
            <option value="yandex-ads">Яндекс.Реклама</option>
          </select>
        </label>

        <label class="form__field">
          <span>Сообщение</span>
          <textarea name="message" rows="4"></textarea>
        </label>

        <label class="form__checkbox">
          <input type="checkbox" name="agree" required />
          <span
            >Согласен с
            <a href="/privacy.html">политикой конфиденциальности</a></span
          >
        </label>

        <button type="submit" class="btn btn--primary">Отправить</button>
      </form>
    </div>
  </div>
</div>
